
name: Build dLaman Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check project structure
        shell: bash
        run: |
          echo "Repository contents:"
          ls -la
          echo "Gradle project files:"
          find . -maxdepth 4 \
            \( -name 'settings.gradle' \
            -o -name 'settings.gradle.kts' \) \
            -print

      - name: Locate Android project
        shell: bash
        run: |
          if [ -f "settings.gradle" ] || \
             [ -f "settings.gradle.kts" ]; then
            PROJECT_DIR="."
          elif [ -f "dlaman-android-pos/settings.gradle" ] || \
               [ -f "dlaman-android-pos/settings.gradle.kts" ]; then
            PROJECT_DIR="dlaman-android-pos"
          else
            echo "ERROR: Android Gradle project not found."
            echo "Upload the complete Android source project."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project found: $PROJECT_DIR"

      - name: Locate Android SDK Manager
        shell: bash
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager -print -quit)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: Android SDK Manager not found"
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          set -o pipefail

      - name: Install Android SDK packages
        shell: bash
        run: |
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p apk-output

          find "$PROJECT_DIR" \
            -path '*/build/outputs/apk/debug/*.apk' \
            -exec cp {} apk-output/ \;

          if ! compgen -G "apk-output/*.apk" > /dev/null; then
            echo "ERROR: No APK generated"
            exit 1
          fi

          ls -lh apk-output/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dLaman-POS58B-APK
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 30
